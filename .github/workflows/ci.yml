name: CI

# 모든 PR에서 돈다(main 보호 규칙의 필수 검사가 이 job이다).
# 문서(docs/, *.md)만 바뀌었으면 설치·검사를 건너뛰고 바로 통과한다.
on:
  pull_request:

# 같은 PR에 다시 push하면 앞선 실행은 취소한다
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # PR 병합 커밋과 그 첫 부모(base)를 비교해 문서 밖 파일이 있는지 본다
      - id: changes
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "문서만 바뀌어 검사를 건너뛴다"
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code == 'true'
        run: pnpm check
